name: LUMAVUN Hedge Android
on:
  workflow_dispatch:
  push:
    branches: [feat/lumavun-hedge-apk]
    paths:
      - 'android-hedge/**'
      - 'hedge-bot/**'
      - '.github/workflows/lumavun-hedge-android.yml'
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hedge-bot/hedge.test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon -p android-hedge :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LUMAVUN-Hedge-debug
          path: android-hedge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
